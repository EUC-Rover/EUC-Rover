name: Deploy EUC ROVER demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and upload demo website
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run build:demo
          out-dir: dist-demo
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://EUC-Rover.github.io
          SITE_BASE: /euc-rover/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
